name: Terraform Template Test
on:
  workflow_call:
    inputs:
      vm_id:
        required: true
        type: number
      windows:
        required: false
        default: false
        type: boolean
      test_reboot:
        description: "Reboot the VM and verify it comes back on the same IP."
        required: false
        default: true
        type: boolean
      test_machine_id:
        description: "Clone a second VM and verify the two clones do not share an identity."
        required: false
        default: true
        type: boolean
    secrets:
      netbird_setup_key:
        required: true
      proxmox_host:
        required: true
      proxmox_user:
        required: true
      proxmox_password:
        required: true
env:
  # renovate: githubReleaseVar repo=netbirdio/netbird
  NETBIRD_VERSION: 0.84.0
  NETBIRD_MANAGEMENT_URL: https://api.netbird.io:443
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform-template-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Netbird Connect
        shell: bash
        env:
          SETUP_KEY: ${{ secrets.netbird_setup_key }}
        run: |
          cd "$RUNNER_TEMP"
          base_url="https://github.com/netbirdio/netbird/releases/download/v${NETBIRD_VERSION}"
          archive="netbird_${NETBIRD_VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "${base_url}/${archive}"
          curl -fsSL "${base_url}/netbird_${NETBIRD_VERSION}_checksums.txt" | grep " ${archive}$" | sha256sum -c -
          sudo tar -xzf "${archive}" -C /usr/local/bin netbird
          sudo netbird service install
          sudo netbird service start
          # NetBird >= 0.83 requires profile ownership; run as root so the root user owns the default profile
          sudo netbird up --setup-key="$SETUP_KEY" --hostname="github-$(cat /etc/hostname)" --management-url="$NETBIRD_MANAGEMENT_URL"
          timeout 120 bash -c 'until sudo netbird status | grep -q "Management: Connected"; do sleep 2; done'
      - name: Use Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          # renovate: githubReleaseVar repo=hashicorp/terraform
          terraform_version: 1.17.2
          terraform_wrapper: false
      - name: Install pywinrm
        if: inputs.windows
        run: sudo apt-get update && sudo apt-get install -y python3-winrm
      - name: Terraform Init
        run: terraform init -input=false
      - name: Terraform Test
        env:
          TF_VAR_proxmox_host: ${{ secrets.proxmox_host }}
          TF_VAR_proxmox_user: ${{ secrets.proxmox_user }}
          TF_VAR_proxmox_password: ${{ secrets.proxmox_password }}
          TF_VAR_template_id: ${{ inputs.vm_id }}
          TF_VAR_windows: ${{ inputs.windows }}
          TF_VAR_node: proxmox
          TF_VAR_pool: templates
          TF_VAR_cloud_init_storage_pool: local-lvm
          TF_VAR_test_reboot: ${{ inputs.test_reboot }}
          TF_VAR_test_machine_id: ${{ inputs.test_machine_id }}
        run: terraform test -verbose

      - name: Netbird Disconnect
        if: always()
        shell: bash
        run: sudo netbird down
