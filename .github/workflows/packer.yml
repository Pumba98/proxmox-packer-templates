name: Packer
on:
  workflow_call:
    inputs:
      name:
        required: true
        type: string
      vm_id:
        required: true
        type: number
      test:
        description: "Run the terraform template test after the build."
        required: false
        default: true
        type: boolean
      windows:
        description: "Template is a Windows template, so test it over WinRM instead of cloud-init/SSH."
        required: false
        default: false
        type: boolean
      test_reboot:
        description: "Reboot the VM during the test and verify it comes back on the same IP."
        required: false
        default: true
        type: boolean
      test_machine_id:
        description: "Clone a second VM during the test and verify the clones do not share an identity."
        required: false
        default: true
        type: boolean
    secrets:
      netbird_setup_key:
        required: true
      proxmox_host:
        required: true
      proxmox_user:
        required: true
      proxmox_password:
        required: true
concurrency:
  group: ${{ inputs.vm_id }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Netbird Connect
        uses: gene1wood/netbird-connect@b8c6916d108aee5e327546e49efcd29bbd41b69f #v1.1.0
        with:
          setup-key: ${{ secrets.netbird_setup_key }}
      - name: Use Packer
        uses: hashicorp-contrib/setup-packer@v4
        with:
          # renovate: githubReleaseVar repo=hashicorp/packer
          packer-version: 1.16.0
      - name: Install mkisofs
        run: sudo apt update && sudo apt install -y mkisofs
      - name: Build image from template
        env:
          PKR_VAR_proxmox_host: ${{ secrets.proxmox_host }}
          PKR_VAR_proxmox_user: ${{ secrets.proxmox_user }}
          PKR_VAR_proxmox_password: ${{ secrets.proxmox_password }}
          PKR_VAR_node: proxmox
          PKR_VAR_pool: templates
          PKR_VAR_iso_storage_pool: local
          PKR_VAR_disk_storage_pool: local-lvm
          PKR_VAR_cloud_init_storage_pool: local-lvm
          PKR_VAR_disk_format: raw
          PKR_VAR_iso_download: "true"
          PKR_VAR_iso_download_pve: "true"
          PKR_VAR_vmid: ${{ inputs.vm_id }}
          PKR_VAR_packer_http_interface: "wt0"
          PACKER_KEY_INTERVAL: 100ms
        run: |
          packer init config.pkr.hcl
          packer build -var-file="${{ inputs.name }}.pkrvars.hcl" -force .

      - name: Netbird Disconnect
        if: always()
        shell: bash
        run: sudo netbird down

  test:
    needs: build
    if: inputs.test
    uses: ./.github/workflows/terraform-test.yml
    with:
      vm_id: ${{ inputs.vm_id }}
      windows: ${{ inputs.windows }}
      test_reboot: ${{ inputs.test_reboot }}
      test_machine_id: ${{ inputs.test_machine_id }}
    secrets:
      netbird_setup_key: ${{ secrets.netbird_setup_key }}
      proxmox_host: ${{ secrets.proxmox_host }}
      proxmox_user: ${{ secrets.proxmox_user }}
      proxmox_password: ${{ secrets.proxmox_password }}
